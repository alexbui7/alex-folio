# Entries are shown in the order they appear here, newest first.
#
# Fields:
#   type:       work | education | milestone  (controls the marker icon)
#   start/end:  free text, e.g. "2023" / "Present"
#   title:      role or achievement
#   org:        company, school, or issuer
#   url:        optional link for the org
#   location:   optional
#   summary:    one or two sentences shown everywhere
#   highlights: optional list of { label, text } shown on /work/ only
#   tags:       optional list of technologies / topics shown as chips
#   photos:     optional list of photos shown on /work/ only.
#               Put the image files in assets/img/work/ and reference them as:
#                 photos:
#                   - file: vcb-workshop.jpg
#                     caption: Architecture workshop with the data engineering team
