- type: work
  start: "2023"
  end: Present
  title: Software Engineer — Cloud & Data Platform
  org: Vietcombank
  url: https://www.vietcombank.com.vn
  location: Hanoi, Vietnam
  summary: >
    Designing and building the foundations of ODP, the bank's enterprise cloud data and ML platform on AWS and Databricks —
    from multi-account architecture and private networking to IaC, CI/CD, security, and cost governance, in a regulated environment.
  highlights:
    - label: AWS platform architecture
      text: Multi-account structure, networking, security, and platform governance for the cloud data platform.
    - label: Databricks platform
      text: Workspace architecture, Unity Catalog, compute, identity, access control, and environment separation on AWS.
    - label: Private connectivity
      text: Secure links between enterprise networks, AWS, and Databricks using Direct Connect/VPN, Transit Gateway, Firewall, PrivateLink, VPC endpoints, and Route 53 hybrid DNS.
    - label: Identity & security
      text: IAM roles and groups integrating Microsoft Entra ID with Databricks SSO/SCIM, service principals, RBAC, and secrets management.
    - label: IaC & CI/CD
      text: Terraform and Databricks Asset Bundles for consistent deployments across environments, plus CI/CD standards for Python and ETL workloads.
    - label: Governance & FinOps
      text: Compute policies, tagging, usage monitoring, and cost allocation to keep the platform efficient and accountable.
    - label: Working across teams
      text: Aligning Data Engineering, Infrastructure, Security, Architecture, and external vendors on requirements, solution architecture, BOMs, and implementation plans.
  tags: [AWS, Databricks, Terraform, Unity Catalog, Entra ID, GitLab CI/CD, FinOps]
  photos: []

